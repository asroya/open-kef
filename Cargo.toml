[workspace]
resolver = "2"
members = ["crates/core", "crates/apple_music", "crates/cli", "crates/design_tokens", "crates/ffi"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
